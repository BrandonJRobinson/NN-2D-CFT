# =====================================================================
# Frozen configuration for the JHEP Virasoro evidence campaign.
# Every convention here is anchored to Draft-JHEP-Active-v6.tex; see
# results/jhep_frozen/REPOSITORY_MAP.md section 3 for the mapping.
# Changing this file changes config_hash and therefore invalidates
# --skip-existing for downstream artifacts.
# =====================================================================
suite: jhep_virasoro_frozen
version: 1

global:
  # Strict physical window, eq. (2.5): r_min = margin_uv/Lambda_UV,
  # r_max = 1/(margin_ir*Lambda_IR).
  window_margin_uv: 30.0
  window_margin_ir: 30.0
  # Reference radius ratio, eq. (3.9).
  rho_reference: 2.0
  # Angular quadrature for the cross-validating general path.
  quadrature_points: 256
  quadrature_points_refine: 512
  # Filtered-Fock readout parameters for R_raw (Theorem 4.6).
  algebra_level: 2          # K
  algebra_mode_span: 3      # m_alg: audited |m|,|n| <= m_alg
  algebra_charges: [0.0, 0.7]
  central_charge: 1.0
  # Manuscript's sharp annulus, eq. (2.2). The tapered variant is a labelled
  # regulator diagnostic only and is never used for a manuscript claim.
  #
  # REGULATOR CLASSES. The frozen suite runs every kernel-level metric under
  # both, in separate rows labelled by `regulator_class`:
  #   sharp_annulus_manuscript  taper = 0.00  eq. (2.2) exactly as written
  #   tapered_log_window        taper = 0.15  minimal raised-cosine taper in
  #                                           log k, retained as an explicitly
  #                                           labelled regulator diagnostic
  # The sharp class is the manuscript claim; the tapered class exists solely to
  # localize a sharp-cutoff (Gibbs) systematic and is never substituted for it.
  regulator_taper: 0.0
  regulator_taper_diagnostic: 0.15
  regulator_classes:
    sharp_annulus_manuscript: 0.0
    tapered_log_window: 0.15

